name: clean_gallery
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  go_router: ^18.1.1
  intl: ^0.20.3
  latlong2: ^0.10.1
  permission_handler: ^13.0.2
  photo_manager: ^3.12.0
  riverpod_annotation: ^4.0.7
  video_player: ^2.14.1

dev_dependencies:
  build_runner: ^2.16.2
  drift_dev: ^2.35.2
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  image: ^4.12.0
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true
  fonts:
    # Variable font (wght 200–800), bundled so nothing is fetched at runtime.
    # License: assets/fonts/manrope/OFL.txt
    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope/Manrope-Variable.ttf
