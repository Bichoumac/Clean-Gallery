config:
  default: true
  # Long lines are fine in prose and tables.
  MD013: false
  # Allow repeated headings in different sections (e.g. "Tests" in each feature).
  MD024:
    siblings_only: true
  # Indented code blocks are used in the original project brief.
  MD046: false

ignores:
  - build/**
  - "**/build/**"
  - .dart_tool/**
  - prompt.md
